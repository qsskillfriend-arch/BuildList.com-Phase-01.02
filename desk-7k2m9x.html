/* Write the child tables: replace this firm's rows with what is on screen. */
async function saveListingChildren(firmId, L) {
  const catIds = (DB.taxonomy.categories || [])
    .filter(k => L.categories.includes(k.slug)).map(k => k.id).filter(Boolean);
  const steps = [
    sb.from('firm_categories').delete().eq('firm_id', firmId),
    sb.from('firm_services').delete().eq('firm_id', firmId),
    sb.from('firm_projects').delete().eq('firm_id', firmId)
  ];
  for (const st of steps) { const { error } = await st; if (error) return error; }
  const ins = [];
  if (catIds.length) ins.push(sb.from('firm_categories').insert(
    L.categories.map(slug => (DB.taxonomy.categories.find(k => k.slug === slug) || {}).id)
      .filter(Boolean).map(id => ({ firm_id: firmId, category_id: id }))));
  if (L.services.length) ins.push(sb.from('firm_services').insert(
    L.services.map((label, i) => ({ firm_id: firmId, label, sort: i }))));
  if (L.projects.length) ins.push(sb.from('firm_projects').insert(
    L.projects.map(p => ({ firm_id: firmId, name: p.name, value: p.value || null,
      year: parseInt(p.year, 10) || null }))));
  for (const q of ins) { const { error } = await q; if (error) return error; }
  return null;
}

/* ═══════════════════════════════════════════════════════════════
   IMAGE PIPELINE
   Every upload is decoded, corrected for orientation, and re-encoded
   at three widths before it leaves the browser. Three reasons this
   happens here rather than on a server:

     1. Supabase image transformation is a paid feature. Doing the work
        client-side gives the same result on the free tier.
     2. A 6MB phone photo becomes ~250KB before it crosses the network,
        which matters when the person uploading is on a mobile bundle.
     3. Serving a 400px-wide file to a phone instead of a 1600px one is
        the single biggest thing you can do for load time in Uganda.

   Nothing is ever upscaled — a small source stays small and is flagged
   rather than blown up into something blurry.
   ═══════════════════════════════════════════════════════════════ */
const IMG = {
  /* Fallback widths, used only when a target has no size of its own. */
  widths: [1600, 800, 400],
  quality: 0.82,
  /* Artwork with lettering or flat colour — banners, logos, fliers —
     shows compression artefacts around edges long before a photograph
     does, so it is encoded at a higher quality. The extra bytes are
     small on a 970x90 banner and very visible if you skip them. */
  qualityByKind: { artwork: 0.92, photo: 0.82, logo: 0.94 },
  /* Screens are commonly 2x or 3x. Serving a 970px file into a 970px
     slot on a phone looks soft, so the largest variant is drawn at twice
     the slot's width wherever the source allows it. */
  dpr: 2,
  maxSourceMB: 25,
  /* What each slot actually needs, so we can warn before it ships */
  targets: {
    'ad-leaderboard':  { w: 970,  h: 90,  label: 'Leaderboard banner', kind: 'artwork' },
    'ad-billboard':    { w: 970,  h: 250, label: 'Billboard banner',    kind: 'artwork' },
    'ad-rectangle':    { w: 300,  h: 250, label: 'Sidebar rectangle',   kind: 'artwork' },
    'ad-halfpage':     { w: 300,  h: 600, label: 'Half page',           kind: 'artwork' },
    'ad-square':       { w: 250,  h: 250, label: 'Square',              kind: 'artwork' },
    'ad-smallbanner':  { w: 300,  h: 100, label: 'Small banner',        kind: 'artwork' },
    'ad-footer':       { w: 728,  h: 90,  label: 'Footer leaderboard',  kind: 'artwork' },
    'flier':           { w: 900,  h: 0,   label: 'Flier (any shape)',   kind: 'artwork' },
    'article':         { w: 1200, h: 675, label: 'Article image',       kind: 'photo' },
    'logo':            { w: 400,  h: 400, label: 'Firm logo',           kind: 'logo' },
    'firm-photo':      { w: 1200, h: 900, label: 'Firm photograph',     kind: 'photo' },
    'spotlight':       { w: 1200, h: 900, label: 'Monthly spotlight',   kind: 'photo' },
    'project-photo':   { w: 1200, h: 900, label: 'Project photograph',  kind: 'photo' },
    'firm-video':      { w: 0,    h: 0,   label: 'Firm video', video: true },
    'ad-video':        { w: 0,    h: 0,   label: 'Advertisement video', video: true }
  }
};

function supportsWebp() {
  const c = document.createElement('canvas');
  return c.toDataURL('image/webp').startsWith('data:image/webp');
}
const WEBP = supportsWebp();

async function decodeImage(file) {
  /* createImageBitmap handles EXIF orientation, so a photo taken
     sideways on a phone does not arrive rotated. */
  if (window.createImageBitmap) {
    try { return await createImageBitmap(file, { imageOrientation: 'from-image' }); }
    catch (e) { /* fall through */ }
  }
  return await new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => res(img);
    img.onerror = rej;
    img.src = URL.createObjectURL(file);
  });
}

/* Shrinking a 4000px photograph straight to 400px in one draw throws
   away most of the pixels and leaves the result soft and aliased, even
   with high-quality smoothing. Halving repeatedly until we are within
   2x of the target averages those pixels properly, which is what makes
   small images look crisp rather than muddy. */
function resizeTo(bitmap, targetW) {
  const scale = Math.min(1, targetW / bitmap.width);   // never upscale
  const w = Math.round(bitmap.width * scale);
  const h = Math.round(bitmap.height * scale);

  let src = bitmap, sw = bitmap.width, sh = bitmap.height;
  while (sw / 2 > w) {
    sw = Math.max(w, Math.round(sw / 2));
    sh = Math.max(h, Math.round(sh / 2));
    const step = document.createElement('canvas');
    step.width = sw; step.height = sh;
    const sctx = step.getContext('2d', { alpha: true });
    sctx.imageSmoothingEnabled = true;
    sctx.imageSmoothingQuality = 'high';
    sctx.drawImage(src, 0, 0, sw, sh);
    src = step;
  }

  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d', { alpha: true });
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(src, 0, 0, w, h);
  return { canvas: c, w, h };
}

/* A logo or a banner on a transparent background turns black if it is
   flattened into JPEG. Detect alpha and keep a format that carries it. */
function hasTransparency(bitmap) {
  const n = 48;
  const c = document.createElement('canvas');
  c.width = Math.min(n, bitmap.width); c.height = Math.min(n, bitmap.height);
  const ctx = c.getContext('2d');
  ctx.drawImage(bitmap, 0, 0, c.width, c.height);
  try {
    const d = ctx.getImageData(0, 0, c.width, c.height).data;
    for (let i = 3; i < d.length; i += 4) if (d[i] < 250) return true;
  } catch (e) { /* tainted canvas: assume none */ }
  return false;
}

/* The widths this particular slot should be served at: twice the slot
   for sharp screens, the slot itself, and a small one for phones on a
   poor connection. Never larger than the file we were given. */
function widthsFor(targetKey, sourceWidth) {
  const t = IMG.targets[targetKey];
  const want = t && t.w
    ? [t.w * IMG.dpr, Math.round(t.w * 1.5), t.w, Math.round(t.w * 0.6)]
    : IMG.widths.slice();
  const out = [];
  for (const w of want) {
    const capped = Math.min(w, sourceWidth);
    if (capped >= 64 && !out.some(x => Math.abs(x - capped) < 24)) out.push(capped);
  }
  return out.sort((a, b) => b - a);
}

const canvasBlob = (c, type, q) => new Promise(res => c.toBlob(res, type, q));

/* An SVG is stored as supplied: one file, every size, no loss. */
async function passThroughSvg(file, targetKey) {
  const base = file.name.replace(/\.[^.]+$/, '').toLowerCase()
    .replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 48) || 'image';
  const stamp = Date.now().toString(36);
  return {
    base, ext: 'svg', type: 'image/svg+xml', alpha: true, quality: 1,
    verdict: { level: 'ok', msg: 'Vector artwork \u2014 stored as supplied, sharp at every size.' },
    natural: { w: 0, h: 0 }, originalBytes: file.size,
    variants: [{ width: 0, height: 0, blob: file, bytes: file.size, name: `${base}-${stamp}.svg` }]
  };
}

/* Judge the source against the slot it is going into, before upload */
function assess(bitmap, targetKey) {
  const t = IMG.targets[targetKey];
  if (!t) return { level: 'ok', msg: '' };
  const notes = [];
  const ideal = t.w * IMG.dpr;
  if (bitmap.width < t.w * 0.9)
    notes.push({ level: 'bad', msg: `Only ${bitmap.width}px wide; this slot needs at least ${t.w}px and looks best at ${ideal}px. It will appear soft. Ask for a larger file.` });
  else if (bitmap.width < ideal * 0.9)
    notes.push({ level: 'warn', msg: `${bitmap.width}px is enough, but ${ideal}px would stay sharp on a modern phone screen.` });
  if (t.h) {
    const want = t.w / t.h, got = bitmap.width / bitmap.height;
    if (Math.abs(got - want) / want > 0.12)
      notes.push({ level: 'warn', msg: `Shape is ${got.toFixed(2)}:1, the slot is ${want.toFixed(2)}:1. It will letterbox rather than stretch \u2014 correct, but you lose part of the box.` });
  }
  if (bitmap.width > t.w * 3)
    notes.push({ level: 'warn', msg: `Much larger than needed. We will resize it down, so nothing is wasted.` });
  if (!notes.length) return { level: 'ok', msg: 'Right size and shape for this slot.' };
  return notes.find(n => n.level === 'bad') || notes[0];
}

/* Produce every size we will serve, from one source file */
async function processImage(file, targetKey) {
  if (!/^image\//.test(file.type)) throw new Error('Not an image file');
  if (file.size > IMG.maxSourceMB * 1024 * 1024)
    throw new Error(`Over ${IMG.maxSourceMB}MB. Please export a smaller version.`);

  /* Vector artwork is already perfect at every size. Re-drawing it into
     a canvas would turn it into pixels and make it worse, so an SVG is
     stored exactly as supplied. */
  if (file.type === 'image/svg+xml') return passThroughSvg(file, targetKey);

  const bmp = await decodeImage(file);
  const verdict = assess(bmp, targetKey);
  const t = IMG.targets[targetKey] || {};
  const alpha = hasTransparency(bmp);
  /* PNG is kept when the artwork is transparent and WebP is unavailable,
     because JPEG would fill the transparency with black. */
  const type = WEBP ? 'image/webp' : (alpha ? 'image/png' : 'image/jpeg');
  const ext  = WEBP ? 'webp' : (alpha ? 'png' : 'jpg');
  const quality = IMG.qualityByKind[t.kind] || IMG.quality;
  const base = file.name.replace(/\.[^.]+$/, '').toLowerCase()
                .replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 48) || 'image';
  const stamp = Date.now().toString(36);

  const variants = [];
  for (const w of widthsFor(targetKey, bmp.width)) {
    const { canvas, w: rw, h: rh } = resizeTo(bmp, w);
    const blob = await canvasBlob(canvas, type, quality);
    variants.push({ width: rw, height: rh, blob, bytes: blob.size,
                    name: `${base}-${stamp}-${rw}.${ext}` });
  }
  return {
    base, ext, type, verdict, quality, alpha,
    natural: { w: bmp.width, h: bmp.height },
    originalBytes: file.size,
    variants
  };
}


/* ═══════════════════════════════════════════════════════════════
   VIDEO PIPELINE
   Browsers cannot re-encode video, so unlike images the file goes up
   as it arrived. Three things we can do, and do:

     1. Cap the size. Supabase Free applies a 50MB global file limit;
        we stop at 45MB so a file never fails at the ceiling with an
        opaque error.
     2. Generate a poster frame. A video with no poster shows a black
        rectangle until it plays, which on a slow connection is most
        of the time. We seek to one second, draw to canvas and upload
        that alongside.
     3. Upload resumably. Supabase recommends its TUS endpoint above
        roughly 6MB; a 40MB file over Ugandan mobile data will drop at
        least once, and a plain POST starts again from zero.
   ═══════════════════════════════════════════════════════════════ */
const VIDEO_CFG = {
  maxBytes: 45 * 1024 * 1024,
  resumableAbove: 6 * 1024 * 1024,
  chunk: 6 * 1024 * 1024,
  accept: ['video/mp4', 'video/webm', 'video/quicktime'],
  bucket: 'videos'
};

function humanBytes(n) {
  return n >= 1048576 ? (n / 1048576).toFixed(1) + 'MB'
       : n >= 1024 ? Math.round(n / 1024) + 'KB' : n + 'B';
}

/* Poster frame. MOV often will not decode in the browser even though
   Supabase will store it — we return null rather than failing the
   whole upload, and the portal says so. */
function posterFrom(file) {
  return new Promise(resolve => {
    const v = document.createElement('video');
    v.preload = 'metadata';
    v.muted = true;
    v.playsInline = true;
    const url = URL.createObjectURL(file);
    let done = false;
    const finish = out => { if (done) return; done = true; URL.revokeObjectURL(url); resolve(out); };

    v.onloadedmetadata = () => {
      const meta = { width: v.videoWidth, height: v.videoHeight, duration: v.duration };
      if (!v.videoWidth) return finish({ blob: null, meta });
      v.currentTime = Math.min(1, (v.duration || 2) / 2);
      v.onseeked = () => {
        try {
          const c = document.createElement('canvas');
          const scale = Math.min(1, 1280 / v.videoWidth);
          c.width = Math.round(v.videoWidth * scale);
          c.height = Math.round(v.videoHeight * scale);
          c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
          c.toBlob(b => finish({ blob: b, meta }), WEBP ? 'image/webp' : 'image/jpeg', 0.8);
        } catch (e) { finish({ blob: null, meta }); }
      };
    };
    v.onerror = () => finish({ blob: null, meta: {} });
    setTimeout(() => finish({ blob: null, meta: {} }), 12000);
    v.src = url;
  });
}

/* Minimal TUS client for Supabase resumable uploads. Enough of the
   protocol to create an upload and PATCH it in chunks, reporting
   progress and surviving a dropped connection. */
async function tusUpload(file, path, onProgress) {
  const base = SUPABASE_URL.replace(/\/$/, '') + '/storage/v1/upload/resumable';
  const token = (await sb.auth.getSession()).data.session?.access_token || SUPABASE_ANON_KEY;
  const b64 = v => btoa(unescape(encodeURIComponent(v)));

  const create = await fetch(base, {
    method: 'POST',
    headers: {
      'Tus-Resumable': '1.0.0',
      'Upload-Length': String(file.size),
      'Upload-Metadata': [
        'bucketName ' + b64(VIDEO_CFG.bucket),
        'objectName ' + b64(path),
        'contentType ' + b64(file.type || 'video/mp4'),
        'cacheControl ' + b64('2592000')
      ].join(','),
      Authorization: 'Bearer ' + token,
      'x-upsert': 'true'
    }
  });
  if (!create.ok) throw new Error('Could not start upload: ' + (await create.text()).slice(0, 160));
  const location = create.headers.get('location');
  if (!location) throw new Error('Server did not return an upload location');
  const url = location.startsWith('http') ? location : base.replace('/upload/resumable', '') + location;

  let offset = 0;
  while (offset < file.size) {
    const end = Math.min(offset + VIDEO_CFG.chunk, file.size);
    let attempt = 0, ok = false;
    while (attempt < 3 && !ok) {
      attempt++;
      try {
        const res = await fetch(url, {
          method: 'PATCH',
          headers: {
            'Tus-Resumable': '1.0.0',
            'Upload-Offset': String(offset),
            'Content-Type': 'application/offset+octet-stream',
            Authorization: 'Bearer ' + token
          },
          body: file.slice(offset, end)
        });
        if (!res.ok) throw new Error('chunk ' + res.status);
        offset = parseInt(res.headers.get('upload-offset') || end, 10);
        ok = true;
      } catch (err) {
        if (attempt >= 3) throw new Error('Upload stalled at ' + humanBytes(offset) + '. Check the connection and try again.');
        await new Promise(r => setTimeout(r, 900 * attempt));
      }
    }
    onProgress && onProgress(Math.round(offset / file.size * 100));
  }
  return true;
}

async function processVideo(file, item) {
  if (!VIDEO_CFG.accept.includes(file.type))
    throw new Error('Needs to be MP4, WebM or MOV. This is ' + (file.type || 'an unknown type') + '.');
  if (file.size > VIDEO_CFG.maxBytes)
    throw new Error(humanBytes(file.size) + ' is over the 45MB limit. Export it smaller \u2014 720p at a lower bitrate is usually plenty.');

  item.msg = 'Reading the video\u2026'; item.pct = 8; paintQueue();
  const { blob: posterBlob, meta } = await posterFrom(file);

  const stamp = Date.now().toString(36);
  const base = file.name.replace(/\.[^.]+$/, '').toLowerCase()
    .replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 48) || 'video';
  const ext = file.type === 'video/webm' ? 'webm' : file.type === 'video/quicktime' ? 'mov' : 'mp4';
  const vpath = `${MEDIA_TARGET}/${base}-${stamp}.${ext}`;

  let videoUrl, posterUrl = null;

  if (SESSION.demo || !sb) {
    videoUrl = URL.createObjectURL(file);
    if (posterBlob) posterUrl = URL.createObjectURL(posterBlob);
  } else {
    if (posterBlob) {
      const ppath = `${MEDIA_TARGET}/${base}-${stamp}-poster.${WEBP ? 'webp' : 'jpg'}`;
      const up = await sb.storage.from('media').upload(ppath, posterBlob, {
        contentType: WEBP ? 'image/webp' : 'image/jpeg', cacheControl: '604800', upsert: true
      });
      if (!up.error) posterUrl = sb.storage.from('media').getPublicUrl(ppath).data.publicUrl;
    }

    if (file.size > VIDEO_CFG.resumableAbove) {
      item.msg = 'Uploading (resumable)\u2026'; paintQueue();
      await tusUpload(file, vpath, p => { item.pct = 10 + Math.round(p * 0.85); item.msg = 'Uploading\u2026 ' + p + '%'; paintQueue(); });
    } else {
      item.msg = 'Uploading\u2026'; item.pct = 40; paintQueue();
      const { error } = await sb.storage.from(VIDEO_CFG.bucket).upload(vpath, file, {
        contentType: file.type, cacheControl: '2592000', upsert: false
      });
      if (error) throw new Error(error.message);
    }
    videoUrl = sb.storage.from(VIDEO_CFG.bucket).getPublicUrl(vpath).data.publicUrl;
  }

  const rec = {
    id: 'm-' + stamp + Math.random().toString(36).slice(2, 5),
    kind: 'video', base, target: MEDIA_TARGET, mime: file.type, bytes: file.size,
    naturalW: meta.width || 0, naturalH: meta.height || 0,
    duration: meta.duration || 0,
    posterUrl, storagePath: vpath,
    uploaded: new Date().toISOString().slice(0, 10),
    variants: [{ width: meta.width || 0, height: meta.height || 0, name: vpath, bytes: file.size }],
    urls: { video: videoUrl },
    firmId: null, usedBy: []
  };

  if (!SESSION.demo && sb) {
    await sb.from('media').insert({
      base, kind: 'video', target: MEDIA_TARGET, mime: file.type, bytes: file.size,
      natural_w: meta.width || null, natural_h: meta.height || null,
      duration: meta.duration || null, poster_url: posterUrl, storage_path: vpath,
      variants: rec.variants, urls: rec.urls
    });
  }
  DB.media.unshift(rec);
  return { posterMade: !!posterBlob, rec };
}

/* ═══════════════════════════════════════════════════════════════
   MEDIA LIBRARY
   ═══════════════════════════════════════════════════════════════ */
let MEDIA_TARGET = 'article';
const UPLOADS = [];

RENDER.media = el => {
  el.innerHTML = `
    <div class="note"><b>Images are resized here, in your browser, before they upload.</b>
    Every file becomes three widths (1600, 800 and 400px) in ${WEBP ? 'WebP' : 'JPEG'}, and the
    site serves whichever fits the reader's screen. A phone on a mobile bundle in Mbale gets the
    400px one. Nothing is ever stretched or upscaled \u2014 a small file is flagged rather than
    blown up.</div>

    <div class="toolbar">
      <label for="mTarget" style="font-size:13px;color:var(--text-2)">These images are for</label>
      <select id="mTarget" onchange="MEDIA_TARGET=this.value">
        ${Object.entries(IMG.targets).map(([k, t]) =>
          `<option value="${k}"${k === MEDIA_TARGET ? ' selected' : ''}>${t.label}${t.h ? ` \u00b7 ${t.w}\u00d7${t.h}` : ''}</option>`).join('')}
      </select>
    </div>

    <div class="drop" id="drop">
      <h3>Drop images here</h3>
      <p>Or choose files. JPEG, PNG or WebP, up to ${IMG.maxSourceMB}MB each. Photographs
      straight off a phone are fine \u2014 they get resized on the way in.</p>
      <button class="btn btn-p" onclick="document.getElementById('mFile').click()">Choose files</button>
      <input type="file" id="mFile" accept="image/*" multiple onchange="queueFiles(this.files)">
    </div>

    <div id="upq"></div>
    <h3 style="font-size:15px;margin:22px 0 12px">Library <span class="rowsub" id="mCount"></span></h3>
    <div class="mgrid" id="mgrid"></div>`;

  const drop = document.getElementById('drop');
  ['dragenter','dragover'].forEach(ev => drop.addEventListener(ev, e => {
    e.preventDefault(); drop.classList.add('over');
  }));
  ['dragleave','drop'].forEach(ev => drop.addEventListener(ev, e => {
    e.preventDefault(); drop.classList.remove('over');
  }));
  drop.addEventListener('drop', e => queueFiles(e.dataTransfer.files));
  paintLibrary();
};

async function queueFiles(files) {
  for (const f of Array.from(files)) {
    const item = { name: f.name, status: 'working', pct: 6, msg: 'Reading\u2026' };
    UPLOADS.unshift(item); paintQueue();

    if (/^video\//.test(f.type)) {
      try {
        const { posterMade, rec } = await processVideo(f, item);
        item.status = 'done'; item.pct = 100;
        item.msg = humanBytes(f.size) +
          (rec.duration ? ' \u00b7 ' + Math.round(rec.duration) + 's' : '') +
          (posterMade ? ' \u00b7 poster made' : ' \u00b7 no poster (add one by hand)');
      } catch (err) {
        item.status = 'error'; item.pct = 100; item.msg = err.message;
      }
      paintQueue(); paintLibrary(); buildNav();
      continue;
    }

    try {
      const out = await processImage(f, MEDIA_TARGET);
      item.pct = 60; item.msg = 'Resizing\u2026'; paintQueue();
      const saved = Math.round((1 - out.variants.reduce((a, v) => a + v.bytes, 0) / out.originalBytes) * 100);
      await storeVariants(out);
      item.status = out.verdict.level === 'bad' ? 'warn' : 'done';
      item.pct = 100;
      item.msg = out.verdict.level === 'ok'
        ? `${out.natural.w}\u00d7${out.natural.h} \u00b7 ${out.variants.length} sizes \u00b7 ${saved > 0 ? saved + '% smaller' : 'optimised'}`
        : out.verdict.msg;
    } catch (err) {
      item.status = 'error'; item.pct = 100; item.msg = err.message;
    }
    paintQueue(); paintLibrary();
  }
}

async function storeVariants(out) {
  const rec = {
    id: 'm-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
    base: out.base, target: MEDIA_TARGET,
    naturalW: out.natural.w, naturalH: out.natural.h,
    uploaded: new Date().toISOString().slice(0, 10),
    variants: out.variants.map(v => ({ width: v.width, height: v.height, name: v.name, bytes: v.bytes })),
    usedBy: []
  };
  if (SESSION.demo || !sb) {
    /* Preview mode: keep object URLs so the library is genuinely usable
       without a database behind it. */
    rec.urls = {}; out.variants.forEach(v => { rec.urls[v.width] = URL.createObjectURL(v.blob); });
    rec.demo = true;
    DB.media.unshift(rec);
    return;
  }
  for (const v of out.variants) {
    const path = `${MEDIA_TARGET}/${v.name}`;
    const { error } = await sb.storage.from('media').upload(path, v.blob, {
      contentType: out.type, cacheControl: '604800', upsert: false
    });
    if (error) throw new Error(error.message);
  }
  rec.urls = {};
  out.variants.forEach(v => {
    rec.urls[v.width] = sb.storage.from('media').getPublicUrl(`${MEDIA_TARGET}/${v.name}`).data.publicUrl;
  });
  await sb.from('media').insert({
    base: rec.base, target: rec.target, natural_w: rec.naturalW, natural_h: rec.naturalH,
    variants: rec.variants, urls: rec.urls
  });
  DB.media.unshift(rec);
}

function paintQueue() {
  const el = document.getElementById('upq');
  if (!el) return;
  if (!UPLOADS.length) { el.innerHTML = ''; return; }
  el.innerHTML = '<div class="upq">' + UPLOADS.slice(0, 8).map(u => `
    <div class="row">
      <span class="nm">${esc(u.name)}</span>
      <span class="bar"><i style="width:${u.pct}%"></i></span>
      <span class="st" style="color:${u.status==='error'?'var(--danger)':u.status==='warn'?'var(--pending)':'var(--live)'}">${esc(u.msg)}</span>
    </div>`).join('') + '</div>';
}

/* The widths available for an uploaded image, keyed by pixel width. */
function mediaSetFor(url) {
  if (!url) return null;
  const m = (DB.media || []).find(x => x.kind !== 'video' &&
    Object.values(x.urls || {}).some(u => u === url));
  if (!m) return null;
  const out = {};
  Object.keys(m.urls || {}).forEach(k => { if (!isNaN(Number(k))) out[k] = m.urls[k]; });
  return Object.keys(out).length > 1 ? out : null;
}

function mediaPublicUrl(m) {
  if (m.kind === 'video') return m.urls.video;
  const ws = Object.keys(m.urls).map(Number).filter(n => !isNaN(n));
  return ws.length ? m.urls[Math.max(...ws)] : Object.values(m.urls)[0];
}

function paintLibrary() {
  const el = document.getElementById('mgrid');
  if (!el) return;
  const imgs = DB.media.filter(m => m.kind !== 'video').length;
  const vids = DB.media.length - imgs;
  const cEl = document.getElementById('mCount');
  if (cEl) cEl.textContent = imgs + (imgs === 1 ? ' image' : ' images') +
    (vids ? ' \u00b7 ' + vids + (vids === 1 ? ' video' : ' videos') : '');
  if (!DB.media.length) {
    el.innerHTML = '<div class="empty" style="grid-column:1/-1"><b>Nothing uploaded yet</b>Drop an image or a video above.</div>';
    return;
  }
  el.innerHTML = DB.media.map(m => {
    const isVid = m.kind === 'video';
    const firm = m.firmId && DB.firms.find(f => String(f.id) === String(m.firmId));
    const thumb = isVid
      ? (m.posterUrl
          ? `<img src="${m.posterUrl}" alt="" loading="lazy"><span class="mbadge">\u25B6 video</span>`
          : `<video src="${m.urls.video}" preload="metadata" muted></video><span class="mbadge">\u25B6 video</span>`)
      : `<img src="${mediaPublicUrl(m)}" alt="" loading="lazy">`;
    const widths = isVid ? [] : Object.keys(m.urls || {}).map(Number).filter(n => !isNaN(n)).sort((a, b) => b - a);
    const detail = isVid
      ? `${m.naturalW ? m.naturalW + '\u00d7' + m.naturalH + ' \u00b7 ' : ''}${m.duration ? Math.round(m.duration) + 's \u00b7 ' : ''}${humanBytes(m.bytes || 0)}`
      : `${m.naturalW}\u00d7${m.naturalH} \u00b7 ${widths.length ? widths.join(' / ') + 'px' : m.variants.length + ' sizes'} \u00b7 ${Math.round(m.variants.reduce((a,v)=>a+v.bytes,0)/1024)}KB`;
    return `<div class="mcard">
      <div class="mthumb" onclick="previewMedia('${m.id}')" title="Preview">${thumb}</div>
      <div class="mmeta"><b>${esc(m.base)}</b>
        <div class="dim">${detail}</div>
        ${firm ? `<div class="dim" style="color:var(--live)">on ${esc(firm.name)}</div>` : ''}</div>
      <div class="mact">
        <button class="btn" onclick="copyPublicUrl('${m.id}')">Copy URL</button>
        ${isVid
          ? `<button class="btn" onclick="attachToFirm('${m.id}')">Attach</button>`
          : `<button class="btn" onclick="copyImageRef('${m.id}')">For article</button>`}
        <button class="btn btn-d" onclick="removeMedia('${m.id}')">Delete</button>
      </div></div>`;
  }).join('');
}

function copyPublicUrl(id) {
  const m = DB.media.find(x => x.id === id);
  if (!m) return;

  const m = DB.media.find(x => x.id === id);

    ? `<video src="${m.urls.video}" ${m.posterUrl ? `poster="${m.posterUrl}"` : ''} controls playsinline

function copyImageRef(id) {
  const m = DB.media.find(x => x.id === id);
  if (!m) return;

async function removeMedia(id) {
  const m = DB.media.find(x => x.id === id);
  if (!m) return;
  if (m.usedBy && m.usedBy.length) {
    return toast('In use by ' + m.usedBy.length + ' item(s). Remove it there first.');
  }
  if (!confirm('Remove this image? Anything still pointing at it will show a gap.')) return;
  if (!SESSION.demo && sb) {
    await sb.storage.from('media').remove(m.variants.map(v => `${m.target}/${v.name}`));
    await sb.from('media').delete().eq('base', m.base);
  }
  DB.media = DB.media.filter(x => x.id !== id);
  paintLibrary(); buildNav(); toast('Removed');
}

function ins(snippet) {
  const t = document.getElementById('edBody');
  const [a, b] = [t.selectionStart, t.selectionEnd];
  const sel = t.value.slice(a, b);
  let out = snippet;
  if (sel) {
    if (snippet.includes('**')) out = '**' + sel + '**';
    else if (snippet.startsWith('*')) out = '*' + sel + '*';
    else if (snippet.startsWith('##')) out = '## ' + sel;
    else if (snippet.startsWith('>')) out = '> ' + sel;
    else if (snippet.startsWith('-')) out = '- ' + sel;
    else if (snippet.startsWith('[')) out = '[' + sel + '](https://)';
  }
  t.value = t.value.slice(0, a) + out + t.value.slice(b);
  t.focus(); t.selectionStart = t.selectionEnd = a + out.length;
  paintPreview();
}

function pickImage() {
  if (!DB.media.length) { toast('No images yet \u2014 upload one in the Media library first.'); return; }
  const m = DB.media[0];

}

/* Minimal, deliberate markdown. Everything is escaped first, so a
   pasted angle bracket cannot inject markup into the site. */
function md(src) {
  let t = esc(src || '');
  t = t.replace(/!\[([^\]]*)\]\(media:([^)]+)\)/g, (_, alt, id) => {
    const m = DB.media.find(x => x.id === id);
    if (!m) return `<figure><div style="padding:22px;background:#FBEDED;color:#B83232;border-radius:6px;font-size:13px">Image not found: ${esc(id)}</div></figure>`;
    const ws = Object.keys(m.urls).map(Number).sort((a, b) => a - b);
    const srcset = ws.map(w => `${m.urls[w]} ${w}w`).join(', ');
    return `<figure><img src="${m.urls[ws[ws.length-1]]}" srcset="${srcset}"
      sizes="(max-width: 700px) 100vw, 700px" alt="${esc(alt)}" loading="lazy">
      ${alt ? `<figcaption>${esc(alt)}</figcaption>` : ''}</figure>`;
  });
  t = t.replace(/^###\s+(.+)$/gm, '<h3>$1</h3>')
       .replace(/^##\s+(.+)$/gm, '<h2>$1</h2>')
       .replace(/^&gt;\s?(.+)$/gm, '<blockquote>$1</blockquote>')
       .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
       .replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>')
       .replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g, '<a href="$2" rel="noopener">$1</a>');
  t = t.replace(/(?:^-\s+.+\n?)+/gm, b =>
    '<ul>' + b.trim().split('\n').map(l => '<li>' + l.replace(/^-\s+/, '') + '</li>').join('') + '</ul>');
  return t.split(/\n{2,}/).map(p =>
    /^\s*<(h2|h3|ul|figure|blockquote)/.test(p) ? p : (p.trim() ? '<p>' + p.replace(/\n/g, '<br>') + '</p>' : '')
  ).join('');
}

function paintPreview() {
  const t = document.getElementById('edBody');
  const p = document.getElementById('edPrev');
  if (!t || !p) return;
  const title = (document.getElementById('e_title') || {}).value || '';
  p.innerHTML = (title ? '<h1>' + esc(title) + '</h1>' : '') + md(t.value);
  const words = t.value.trim().split(/\s+/).filter(Boolean).length;
  document.getElementById('wc').textContent =
    words + ' words \u00b7 about ' + Math.max(1, Math.round(words / 200)) + ' min read';
}

      '<td><input value="' + esc(it.val) + '" oninput="DB.prices.items[' + i + '].val=this.value;refreshChip(' + i + ')" style="width:100%"></td>' +
      '<td><input value="' + esc(it.change || '') + '" oninput="DB.prices.items[' + i + '].change=this.value;refreshChip(' + i + ')" style="width:90px"></td>' +
      '<td><select onchange="DB.prices.items[' + i + '].up=(this.value===\'up\'?true:this.value===\'down\'?false:null);refreshChip(' + i + ')">' +
        '<option value="up"' + (it.up === true ? ' selected' : '') + '>Up</option>' +
        '<option value="down"' + (it.up === false ? ' selected' : '') + '>Down</option>' +
        '<option value="flat"' + (it.up == null ? ' selected' : '') + '>Flat</option></select></td>' +

      '<td class="act"><button class="btn btn-d" onclick="delPriceRow(' + i + ')">Remove</button></td></tr>').join('') +
    '</tbody></table></div>' +
    '<div class="note" style="margin-top:16px"><b>Saving writes a new dated snapshot.</b>' +
    'Previous weeks are kept, not overwritten \u2014 after twelve months that series is a record ' +
    'of Kampala material prices nobody else holds, and it is sellable.</div>';
};

/* Exactly what the live prices ribbon on the site will show for this
   row — same arrow, same colour. Editing a direction here and only
   finding out it was wrong on the live site is a needless round trip. */
function tickerChip(it) {
  const up = it.up === true, down = it.up === false;
  const arrow = up ? '\u25B2' : down ? '\u25BC' : '\u2014';
  const colour = up ? '#1F7A4D' : down ? '#B83232' : 'var(--text-3)';
  return '<span style="display:inline-flex;align-items:center;gap:7px;font-size:12.5px;' +
    'background:#0F1A14;color:#E6EDE8;padding:3px 10px;border-radius:12px;white-space:nowrap">' +
    '<span style="color:#9DB3AC">' + esc(it.name) + '</span>' +
    '<strong>' + esc(it.val) + '</strong>' +
    '<span style="color:' + colour + ';font-weight:700">' + arrow + ' ' + esc(it.change || '') + '</span></span>';
}

function todayStr() { return new Date().toISOString().slice(0, 10); }
function newSnapshot() {
  DB.prices = { updated: todayStr(), sources: [], items: [
    { name:'Cement (50kg)', val:'UGX 0', change:'0%', up:null }] };
  go('prices');
}
function addPriceRow() {
  DB.prices.items.push({ name:'New material', val:'UGX 0', change:'0%', up:null });
  go('prices');
}
function delPriceRow(i) { DB.prices.items.splice(i, 1); go('prices'); }
function refreshChip(i) {
  const row = document.querySelectorAll('#priceRows tr')[i];
  if (row) row.children[4].innerHTML = tickerChip(DB.prices.items[i]);
}

async function savePrices() {
  const p = DB.prices;
  if (SESSION.demo || !sb) { toast('Saved in demo only \u2014 nothing was written'); return; }
  const { data: snap, error } = await sb.from('price_snapshots')
    .upsert({ collected_on: p.updated, sources: p.sources || [], note: p.note || '' },
            { onConflict: 'collected_on' })
    .select().single();
  if (error) return toast('Rejected by the database: ' + error.message);
  await sb.from('price_items').delete().eq('snapshot_id', snap.id);
  const rows = p.items.map(i => ({
    snapshot_id: snap.id, material: i.name, value_text: i.val,
    change_text: i.change, direction: i.up === true ? 'up' : i.up === false ? 'down' : 'flat'
  }));
  const { error: e2 } = await sb.from('price_items').insert(rows);
  if (e2) return toast('Rejected by the database: ' + e2.message);
  notePending('Material prices for ' + p.updated); toast('Saved. ' + rows.length + ' materials recorded for ' + p.updated);
}

/* ═══════════════════════════════════════════════════════════════
   PUBLISHING
   Saving writes to the database. The public site is generated at
   build time, so a visitor sees nothing until a deploy runs. This is
   the button that runs one.

   The count of unsaved-to-site changes is kept locally rather than in
   the database on purpose: it answers "have I published since I
   started editing", which is a question about this session, not about
   the data. Two people editing at once each see their own count, and
   either one publishing serves both.
   ═══════════════════════════════════════════════════════════════ */
const PENDING_KEY = 'buildlist-portal-pending';

function pending() {
  try { return JSON.parse(localStorage.getItem(PENDING_KEY) || '[]'); }
  catch (e) { return []; }
}
/* Which saves reach the site on their own.
   Tenders, vacancies, articles, prices, adverts, the monthly slots and
   the legal pages are read live by the public site, so saving them is
   publishing them: they appear on the next page load. Firms, tiers and
   the featured strip are built into real pages for search engines, so
   those still need Publish. */
const LIVE_PREFIXES = ['Tender', 'Vacancy', 'Job', 'Article', 'Material prices', 'Price',
  'Campaign', 'Ad ', 'Monthly slot', 'Digest sponsor', 'Spotlight', 'Legal', 'Review'];
const isLiveSection = what => LIVE_PREFIXES.some(p => String(what).startsWith(p));

function notePending(what) {
  if (SUPABASE_URL && isLiveSection(what)) {
    /* Nothing to publish: tell the person it is already live. */
    flashLive(what);
    return;
  }
  const list = pending();
  list.unshift({ what, at: Date.now() });
  try { localStorage.setItem(PENDING_KEY, JSON.stringify(list.slice(0, 60))); } catch (e) {}
  paintPublish();
}

function flashLive(what) {
  const el = document.getElementById('publishBar');
  if (!el) return;
  el.innerHTML = '<span class="live-now">\u25CF Live on the site now \u2014 ' + esc(String(what).slice(0, 48)) + '</span>';
  clearTimeout(flashLive.t);
  flashLive.t = setTimeout(paintPublish, 5000);
}
function clearPending() {
  try { localStorage.removeItem(PENDING_KEY); } catch (e) {}
  paintPublish();
}

function paintPublish() {
  const el = document.getElementById('publishBar');
  if (!el) return;
  const n = pending().length;
  el.innerHTML = n
    ? '<button class="btn btn-g btn-sm" onclick="go(\'publish\')">' +
      n + ' change' + (n === 1 ? '' : 's') + ' not on the site yet</button>'
    : '<span class="rowsub">Site is up to date</span>';
}

RENDER.publish = el => {
  const liveNote = SUPABASE_URL
    ? '<div class="note"><b>Most changes are live the moment you save them.</b>' +
      'Tenders, vacancies, articles, prices, adverts, the monthly slots and the legal pages are read ' +
      'straight from the database, so there is nothing to publish for those. Publish is only needed ' +
      'for firm listings, tiers and the featured strip, which are built into pages for search engines.</div>'
    : '';
  const list = pending();
  el.innerHTML = liveNote +
    '<div class="note"><b>Saving and publishing are two different things.</b>' +
    'Everything you save is in the database immediately and is not at risk. But the public ' +
    'site is built from that data, so a visitor sees your change only after a build runs. ' +
    'Publishing starts one; it takes about a minute.</div>' +

    (list.length
      ? '<div class="toolbar"><div class="spacer"></div>' +
        '<button class="btn btn-p" id="pubBtn" onclick="publishSite()">Publish ' +
        list.length + ' change' + (list.length === 1 ? '' : 's') + '</button></div>' +
        '<div class="tscroll"><table><thead><tr><th>What changed</th><th>When</th></tr></thead><tbody>' +
        list.map(p => '<tr><td>' + esc(p.what) + '</td>' +
          '<td class="sub mono">' + new Date(p.at).toLocaleString('en-GB',
            { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }) + '</td></tr>').join('') +
        '</tbody></table></div>'
      : '<div class="empty"><b>Nothing waiting</b>Everything you have saved is already on the site, ' +
        'or the site has been built since.' +
        '<div style="margin-top:14px"><button class="btn" onclick="publishSite()">Build anyway</button></div></div>') +

    '<div id="pubResult"></div>' +

    '<div class="note" style="margin-top:20px"><b>If the button says nothing is configured.</b>' +
    'Create a build hook in your host and add the URL as an environment variable named ' +
    '<span class="mono">BUILD_HOOK_URL</span>:<br><br>' +
    '<strong>Vercel:</strong> Settings \u2192 Git \u2192 Deploy Hooks \u2192 Create Hook<br><br>' +
    'Mark it as a secret. It is a bearer token: anyone holding it can trigger builds until the ' +
    'month\u2019s minutes are gone, which is why the portal never holds it and asks the server instead.</div>';
};

async function publishSite() {
  const btn = document.getElementById('pubBtn');
  const out = document.getElementById('pubResult');
  const say = (kind, html) => { if (out) out.innerHTML = '<div class="note' +
    (kind === 'bad' ? ' red' : '') + '" style="margin-top:16px">' + html + '</div>'; };

  if (SESSION.demo || !sb) {
    say('', '<b>Demo mode.</b>Nothing to build \u2014 connect Supabase and set BUILD_HOOK_URL.');
    return;
  }
  if (btn) { btn.disabled = true; btn.textContent = 'Starting the build\u2026'; }

  try {
    const token = (await sb.auth.getSession()).data.session?.access_token;
    const res = await fetch('/api/publish', {
      method: 'POST', headers: { Authorization: 'Bearer ' + token } });
    const data = await res.json().catch(() => ({}));

    if (data.ok) {
      clearPending();
      say('', '<b>Build started.</b>' + esc(data.message || '') +
        ' Refresh the public site in a minute or two. Your host\u2019s deploy log shows progress.');
      go('publish');
    } else {
      say('bad', '<b>Not published.</b>' + esc(data.message || data.error || 'Unknown error.') +
        '<br><br>Nothing is lost \u2014 every change you saved is in the database and will appear ' +
        'at the next build, however that build is started.');
    }
  } catch (err) {
    say('bad', '<b>Could not reach the publish endpoint.</b>' + esc(err.message) +
      '<br><br>Your changes are saved. This only affects starting a build.');
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = 'Publish'; }
  }
}

const starText = n => '\u2605'.repeat(n) + '\u2606'.repeat(5 - n);

    'reading. A firm paying us is never a reason to reject a review.</div>' +
    '<div class="toolbar"><div class="seg">' +
      [['pending', 'Waiting'], ['published', 'Published'], ['rejected', 'Rejected']].map(([k, l]) =>
        '<button class="' + (REV_TAB === k ? 'on' : '') + '" onclick="revTab(\'' + k + '\')">' +
        l + ' (' + count(k) + ')</button>').join('') +
    '</div></div>' +
    (list.length ? list.map(r => {
      const f = firmOf(r);
      const replies = capsOfTier(f.tier).reviewReply;
      return '<div class="panel rev-card">' +
        '<div class="rev-top"><div><span class="nm">' + esc(f.name || 'Unknown firm') + '</span> ' +
          '<span class="pill ' + ((f.tier || 'free') === 'free' ? 'p-off' : 'p-new') + '">' + esc(f.tier || 'free') + '</span></div>' +
          '<span class="rev-stars" aria-label="' + r.rating + ' of 5">' + starText(r.rating) + '</span></div>' +
        '<p class="rev-body">' + esc(r.body) + '</p>' +
        '<div class="rowsub">' + esc(r.author_name) + ' \u00b7 <span class="mono">' + esc(r.author_email || '') + '</span>' +
          (r.was_customer ? ' \u00b7 says they were a customer' : '') +
          ' \u00b7 ' + esc(String(r.created_at || '').slice(0, 10)) + '</div>' +
        (r.status === 'rejected' && r.reject_reason ? '<div class="rowsub" style="margin-top:6px">Rejected: ' + esc(r.reject_reason) + '</div>' : '') +
        (r.firm_reply ? '<div class="rev-replybox"><b>Reply</b>' + (replies ? '' : ' <span class="rowsub">(not shown \u2014 their tier does not include replies)</span>') +
          '<p>' + esc(r.firm_reply) + '</p></div>' : '') +
        '<div class="act" style="justify-content:flex-start;margin-top:12px">' +
          (r.status !== 'published' ? '<button class="btn btn-p" onclick="moderateReview(\'' + esc(r.id) + '\',\'published\')">Publish</button>' : '') +
          (r.status !== 'rejected' ? '<button class="btn btn-d" onclick="rejectReview(\'' + esc(r.id) + '\')">Reject</button>' : '') +
          (r.status === 'published' ? '<button class="btn" onclick="replyReview(\'' + esc(r.id) + '\')">' +
            (r.firm_reply ? 'Edit reply' : 'Add the firm\u2019s reply') + '</button>' : '') +
        '</div></div>';
    }).join('')
    : '<div class="empty"><b>' + (REV_TAB === 'pending' ? 'Nothing waiting' : 'None yet') + '</b>' +
      (REV_TAB === 'pending' ? 'New reviews appear here the moment they are written.' : '') + '</div>');
};

function revTab(k) { REV_TAB = k; go('reviews'); }

async function moderateReview(id, status, extra) {
  const r = (DB.reviews || []).find(x => String(x.id) === String(id));
  if (!r) return;
  const patch = Object.assign({ status, moderated_by: SESSION.user && SESSION.user.id }, extra || {});
  if (!SESSION.demo && sb) {
    const { error } = await sb.from('reviews').update(patch).eq('id', id);
    if (error) return toast('Rejected by the database: ' + error.message);
  }
  Object.assign(r, patch);
  notePending('Review ' + status + ': ' + (firmOf(r).name || ''));
  go('reviews'); buildNav();
  toast(status === 'published' ? 'Published. It appears on the site at the next publish.' : 'Rejected and noted.');
}

function rejectReview(id) {
  CURRENT = { kind: 'revreject', id };
  openDrawer('Reject this review',
    '<div class="note"><b>Only for abusive, fake or off-topic reviews.</b>' +
    'A harsh but genuine review should be published. Record why, so the decision can be explained ' +
    'if the reviewer asks.</div>' +
    sel('e_reason', 'Reason', 'abusive', [
      ['abusive', 'Abusive, threatening or discriminatory'],
      ['fake', 'Appears fake, or written by the firm or a competitor'],
      ['offtopic', 'Not about working with this firm'],
      ['personal', 'Contains someone\u2019s personal details'],
      ['duplicate', 'Duplicate of another review']]) +
    area_('e_note', 'Note (optional)', ''));
}

function replyReview(id) {
  const r = (DB.reviews || []).find(x => String(x.id) === String(id));
  if (!r) return;
  const f = firmOf(r);
  CURRENT = { kind: 'revreply', id };
  openDrawer('Reply from ' + (f.name || 'the firm'),
    (capsOfTier(f.tier).reviewReply ? ''
      : '<div class="note"><b>Their tier does not include public replies.</b>' +
        'You can save it now; it appears automatically if they move to Verified or above.</div>') +
    '<div class="rev-quote">' + esc(starText(r.rating)) + ' \u2014 ' + esc(r.body) + '</div>' +
    area_('e_reply', 'The firm\u2019s reply, in their words', r.firm_reply || '') +
    '<div class="hint">Enter it as the firm sent it to you. Keep it factual; a reply that argues ' +
    'with the reviewer usually does the firm more harm than the review.</div>');
}


/* ═══════════════════════════════════════════════════════════════
   ORDERS
   Every online payment, what it bought and whether it switched on.
   Customers' details are here, so this reads through row-level
   security as staff only.
   ═══════════════════════════════════════════════════════════════ */
const thisMonth = d => d && String(d).slice(0, 7) === new Date().toISOString().slice(0, 7);
const PRODUCT_NAMES = { 'tier-verified': 'Verified listing', 'tier-premium': 'Premium listing',
  'tier-platinum': 'Platinum listing', 'featured-job': 'Featured vacancy', 'category-sponsor': 'Category sponsorship',
  'tender-pro-month': 'Tender Pro, monthly', 'tender-pro-year': 'Tender Pro, yearly' };
let ORD_FILTER = 'all';

RENDER.orders = el => {
  const all = DB.orders || [];
  const paid = all.filter(o => o.status === 'paid');
  const month = paid.filter(o => thisMonth(o.paid_at));
  const sum = xs => xs.reduce((a, o) => a + Number(o.amount || 0), 0);
  const byProduct = {};
  month.forEach(o => { byProduct[o.product] = (byProduct[o.product] || 0) + Number(o.amount || 0); });
  const rows = all.filter(o => ORD_FILTER === 'all' || o.status === ORD_FILTER);
  const pill = st => '<span class="pill ' + ({ paid: 'p-new', pending: 'p-off', failed: 'p-off' }[st] || 'p-off') + '">' + esc(st) + '</span>';

  el.innerHTML =
    (all.length ? '' : '<div class="note"><b>No online payments yet.</b>' +
      'Once FLW_SECRET_KEY and FLW_WEBHOOK_HASH are set in Vercel, every payment made on the site appears here, ' +
      'and what was bought switches on by itself.</div>') +
    '<dl class="kpis an-kpis">' +
      kpi('Revenue this month', 'UGX ' + sum(month).toLocaleString(), month.length + ' payment' + (month.length === 1 ? '' : 's')) +
      kpi('Revenue to date', 'UGX ' + sum(paid).toLocaleString(), paid.length + ' paid orders') +
      kpi('Started, not paid', String(all.filter(o => o.status === 'pending').length), 'worth a follow-up call') +
      kpi('Failed', String(all.filter(o => o.status === 'failed').length), 'declined or not confirmed') +
    '</dl>' +
    (Object.keys(byProduct).length ? '<div class="panel"><h3>This month, by product</h3><div class="an-bars">' +
      Object.entries(byProduct).sort((a, b) => b[1] - a[1]).map(([k, v]) => {
        const pct = sum(month) ? Math.round(v / sum(month) * 100) : 0;
        return '<div class="an-bar"><span>' + esc(PRODUCT_NAMES[k] || k) + '</span><div><i style="width:' + pct +
          '%"></i></div><b>UGX ' + v.toLocaleString() + '</b></div>'; }).join('') + '</div></div>' : '') +
    '<div class="panel"><h3>All orders</h3>' +
      '<div class="toolbar" style="padding:0 0 10px"><div class="seg">' +
        ['all', 'paid', 'pending', 'failed'].map(k => '<button class="' + (ORD_FILTER === k ? 'on' : '') +
          '" onclick="setOrdFilter(\'' + k + '\')">' + k + '</button>').join('') +
      '</div><div class="spacer"></div><button class="btn" onclick="downloadOrders()">Download CSV</button></div>' +
      '<div class="tscroll"><table><thead><tr><th>Ref</th><th>Bought</th><th>For</th><th>Amount</th><th>Status</th><th>Customer</th><th>When</th></tr></thead><tbody>' +
      (rows.length ? rows.slice(0, 300).map(o =>
        '<tr><td class="mono">' + esc(o.tx_ref) + '</td>' +
        '<td>' + esc(PRODUCT_NAMES[o.product] || o.product) + '</td>' +
        '<td>' + esc(o.target || '') + '</td>' +
        '<td class="mono">' + Number(o.amount || 0).toLocaleString() + '</td>' +
        '<td>' + pill(o.status) + (o.note ? '<span class="sub">' + esc(o.note) + '</span>' : '') + '</td>' +
        '<td>' + esc(o.customer_name || '') + '<span class="sub mono">' + esc(o.customer_phone || '') + '</span></td>' +
        '<td class="mono sub">' + esc(String(o.paid_at || o.created_at || '').slice(0, 16).replace('T', ' ')) + '</td></tr>').join('')
        : '<tr><td colspan="7"><div class="empty" style="border:none"><b>Nothing here</b>No orders match.</div></td></tr>') +
      '</tbody></table></div></div>';
};

function setOrdFilter(k) { ORD_FILTER = k; go('orders'); }

function downloadOrders() {
  const head = ['ref', 'product', 'target', 'amount', 'currency', 'status', 'customer', 'phone', 'email', 'created', 'paid', 'note'];
  const rows = (DB.orders || []).map(o => [o.tx_ref, o.product, o.target, o.amount, o.currency, o.status,
    o.customer_name, o.customer_phone, o.customer_email, o.created_at, o.paid_at, o.note]);
  const csv = [head].concat(rows).map(r => r.map(v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"').join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
  a.download = 'buildlist-orders-' + new Date().toISOString().slice(0, 10) + '.csv';
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* ═══════════════════════════════════════════════════════════════
   LISTING CLAIMS
   The decision is not "does this look plausible" — it is "did the
   number already on the listing answer, and did the person on it say
   yes". Approving without that call is how a competitor takes over a
   listing, and you will not find out until the owner rings you angry.
   ═══════════════════════════════════════════════════════════════ */
const openClaims = () => (DB.claims || []).filter(c => c.status === 'pending');

RENDER.claims = el => {
  const list = (DB.claims || []).slice()
    .sort((a, b) => (a.status === 'pending' ? -1 : 1) -
                    (b.status === 'pending' ? -1 : 1) ||
                    String(b.created_at).localeCompare(String(a.created_at)));

  el.innerHTML =
    '<div class="note"><b>Ring the number on the listing, not the number on the claim.</b>' +
    'That is the whole check. A claimant who gives their own number and is confirmed on it has ' +
    'proved nothing \u2014 anyone can answer their own phone.</div>' +
    (!list.length
      ? '<div class="empty"><b>No claims yet</b>They arrive when somebody presses ' +
        '\u201cThis is my business\u201d on a listing.</div>'
      : '<div class="tscroll"><table><thead><tr><th>Firm</th><th>Claimant</th>' +
        '<th>Number to ring</th><th>Received</th><th>State</th><th></th></tr></thead><tbody>' +
        list.map(c => {
          const f = DB.firms.find(x => String(x.id) === String(c.firm_id));
          const pill = c.status === 'pending' ? '<span class="pill p-wait">pending</span>'
            : c.status === 'approved' ? '<span class="pill p-live">approved</span>'
            : '<span class="pill p-off">rejected</span>';
          return '<tr><td><span class="nm">' + esc(f ? f.name : c.firm_id) + '</span>' +
            '<span class="sub">' + esc(f ? f.area || '' : '') + '</span></td>' +
            '<td><span class="nm">' + esc(c.claimant) + '</span>' +
            '<span class="sub">' + esc(c.role || '') + '</span></td>' +
            '<td class="mono">' + esc(f && f.phone ? f.phone : '\u2014 no number on file') + '</td>' +
            '<td class="sub mono">' + esc(String(c.created_at || '').slice(0, 10)) + '</td>' +
            '<td>' + pill + '</td>' +
            '<td class="act"><button class="btn" onclick="reviewClaim(\'' + esc(c.id) + '\')">' +
            (c.status === 'pending' ? 'Review' : 'Open') + '</button></td></tr>';
        }).join('') + '</tbody></table></div>');
};

function reviewClaim(id) {
  const c = (DB.claims || []).find(x => String(x.id) === String(id));
  if (!c) return;
  const f = DB.firms.find(x => String(x.id) === String(c.firm_id));
  CURRENT = { kind: 'claim', id, item: c };

  openDrawer('Claim \u00b7 ' + (f ? f.name : ''),
    '<div class="note"><b>Before you decide, ring ' +
      (f && f.phone ? '<span class="mono">' + esc(f.phone) + '</span>' : 'the listed number') +
      '.</b>Ask for ' + esc(c.claimant) + ' by name. If the number is dead or the person is ' +
      'unknown there, reject it and note why \u2014 do not approve on the strength of the form.</div>' +
    '<fieldset><legend>What they told us</legend>' +
      '<div class="tscroll"><table><tbody>' +
      '<tr><td style="width:150px"><span class="sub">Name</span></td><td><strong>' + esc(c.claimant) + '</strong></td></tr>' +
      '<tr><td><span class="sub">Role</span></td><td>' + esc(c.role || '\u2014') + '</td></tr>' +
      '<tr><td><span class="sub">Their number</span></td><td class="mono">' + esc(c.phone || '\u2014') + '</td></tr>' +
      '<tr><td><span class="sub">Email</span></td><td class="mono">' + esc(c.email || '\u2014') + '</td></tr>' +
      '<tr><td><span class="sub">Evidence</span></td><td>' + esc(c.evidence || '\u2014') + '</td></tr>' +
      '<tr><td><span class="sub">Number on listing</span></td><td class="mono">' +
        esc(f && f.phone ? f.phone : 'none') + '</td></tr>' +
      '</tbody></table></div>' +
    '</fieldset>' +
    '<fieldset><legend>Your decision</legend>' +
      sel('e_decision', 'Outcome', c.status, [
        ['pending', 'Still pending \u2014 not yet called'],
        ['approved', 'Approved \u2014 I rang the listed number and confirmed'],
        ['rejected', 'Rejected']]) +
      area_('e_note', 'Note', c.note || '',
        'What happened on the call. Whoever picks this up next has only this to go on.') +
      '<div class="hint">Approving links this person to the listing. They can then correct ' +
      'contact details, description, photos, services and hours. They cannot change the ' +
      'business name, web address, district, tier, verification or approval status \u2014 those ' +
      'stay with you, and the database enforces it.</div>' +
    '</fieldset>');
}

/* ═══════════════════════════════════════════════════════════════
   MONTHLY SLOTS
   Product of the Month is bought. Benchmark Project is not, and the
   editor makes that structural: the project form has no advertiser
   field, no link field and no rate field, and the database trigger
   clears them anyway. A rule you cannot break by accident is worth
   more than one written in a policy document.
   ═══════════════════════════════════════════════════════════════ */
function thisMonthStr() { return new Date().toISOString().slice(0, 7); }

RENDER.spotlight = el => {
  const sp = DB.spotlight || {};
  const stale = k => sp[k] && sp[k].active !== false && sp[k].month !== thisMonthStr();

  const card = (key, title, sub, paid) => {
    const o = sp[key] || {};
    return '<div class="panel" style="margin-bottom:16px">' +
      '<h3>' + title + '</h3>' +
      '<div class="tscroll"><table><tbody>' +
      '<tr><td style="width:190px"><span class="sub">Status</span></td><td>' +
        (o.active === false ? '<span class="pill p-off">not running</span>'

          : '<span class="pill p-live">current</span>') +
        '<span class="sub" style="margin-left:10px">' + esc(sub) + '</span></td></tr>' +
      '<tr><td><span class="sub">' + (paid ? 'Product' : 'Project') + '</span></td>' +
        '<td><strong>' + esc(o.name || '\u2014') + '</strong></td></tr>' +
      (paid ? '<tr><td><span class="sub">Advertiser</span></td><td>' + esc(o.advertiser || '\u2014') + '</td></tr>' : '') +
      '<tr><td><span class="sub">Month</span></td><td class="mono">' + esc(o.month || '\u2014') + '</td></tr>' +

      '<div class="act" style="margin-top:12px;justify-content:flex-start">' +
      '<button class="btn btn-p" onclick="editSpot(\'' + key + '\')">Edit</button></div></div>';
  };

  el.innerHTML =
    (stale('product') || stale('project')
      ? '<div class="note"><b>A slot is still showing an older month.</b>' +
        'Rotate it or switch it off. An advertiser bought one month; leaving it up looks generous ' +
        'but means you can never sell that month again.</div>' : '') +
    '<div class="note"><b>Two slots, two different rules.</b>' +
    '<strong>Product of the Month</strong> is paid and labelled as advertising everywhere it appears. ' +
    '<strong>Benchmark Project</strong> is editorial and is never sold \u2014 the moment it is for sale, ' +
    'nobody trusts it, and you lose the thing that makes people read the homepage twice.</div>' +
    card('product', 'Product of the Month', 'Paid \u00b7 one advertiser per calendar month', true) +
    card('project', 'Benchmark Project', 'Editorial \u00b7 chosen on merit, never sold', false) +

        (sp.newsletter && sp.newsletter.active !== false
          ? '<span class="pill p-live">sponsored</span>'
          : '<span class="pill p-off">unsponsored</span>') + '</td></tr>' +
      '<tr><td><span class="sub">Sponsor</span></td><td><strong>' +
        esc((sp.newsletter && sp.newsletter.advertiser) || '\u2014') + '</strong></td></tr>' +
      '<tr><td><span class="sub">Until</span></td><td class="mono">' +
        esc((sp.newsletter && sp.newsletter.to) || '\u2014') + '</td></tr>' +
      '</tbody></table></div>' +
      '<div class="act" style="margin-top:12px;justify-content:flex-start">' +
      '<button class="btn btn-p" onclick="editNewsletter()">Edit</button></div></div>';
};

function addPairRow(boxId) {
  const box = document.getElementById(boxId);

/* ═══════════════════════════════════════════════════════════════
   FEATURED FIRMS
   The homepage strip. Six is the practical limit — past that the row
   wraps and the last ones are never seen, which means selling a slot
   you cannot deliver.
   ═══════════════════════════════════════════════════════════════ */
/* go() replaces the page before the renderer runs, so the search box is
   already gone by the time we would read it. Keep the query in state. */
let FEAT_Q = '';

RENDER.featured = el => {
  const feat = DB.firms.filter(f => f.featured)
    .sort((a, b) => (a.featured_sort || 0) - (b.featured_sort || 0));
  const q = FEAT_Q;

  el.innerHTML =
    '<div class="note"><b>Six is the working limit.</b>' +
    'The strip wraps past six and the last ones are never seen \u2014 selling a seventh slot ' +
    'means selling something you cannot deliver.</div>' +
    '<div class="toolbar"><input type="search" id="featQ" placeholder="Search a firm to add" ' +
    'value="' + esc(q) + '" oninput="FEAT_Q=this.value;go(\'featured\')"><div class="spacer"></div>' +
    '<span class="rowsub">' + feat.length + ' of 6 used</span></div>' +

    (feat.length ? '<div class="tscroll"><table><thead><tr><th>Order</th><th>Firm</th><th>Tier</th>' +
      '<th>Paid until</th><th></th></tr></thead><tbody>' +
      feat.map((f, i) =>
        '<tr><td class="mono">' + (i + 1) + '</td>' +
        '<td><span class="nm">' + esc(f.name) + '</span><span class="sub">' + esc(f.area || '') + '</span></td>' +
        '<td><span class="pill ' + (f.tier === 'free' ? 'p-off' : 'p-new') + '">' + esc(f.tier || '') + '</span></td>' +
        '<td class="mono sub">' + esc(f.featured_until || '\u2014') + '</td>' +
        '<td class="act">' +
          (i > 0 ? '<button class="btn" onclick="moveFeatured(\'' + esc(f.id) + '\',-1)">\u2191</button>' : '') +
          (i < feat.length - 1 ? '<button class="btn" onclick="moveFeatured(\'' + esc(f.id) + '\',1)">\u2193</button>' : '') +
          '<button class="btn btn-d" onclick="setFeatured(\'' + esc(f.id) + '\',false)">Remove</button>' +
        '</td></tr>').join('') + '</tbody></table></div>'
      : '<div class="empty"><b>Nothing featured</b>Search above and add up to six.</div>') +

    (q ? '<h3 style="font-size:15px;margin:22px 0 10px">Matches</h3><div class="tscroll"><table><tbody>' +
      DB.firms.filter(f => !f.featured && f.name.toLowerCase().includes(q.toLowerCase()))
        .slice(0, 12).map(f =>
        '<tr><td><span class="nm">' + esc(f.name) + '</span><span class="sub">' + esc(f.area || '') + '</span></td>' +
        '<td><span class="pill ' + (f.tier === 'free' ? 'p-off' : 'p-new') + '">' + esc(f.tier || '') + '</span></td>' +
        '<td class="act"><button class="btn btn-p"' + (feat.length >= 6 ? ' disabled title="Six already"' : '') +
        ' onclick="setFeatured(\'' + esc(f.id) + '\',true)">Feature</button></td></tr>').join('') +
      '</tbody></table></div>' : '');
};

async function setFeatured(id, on) {
  const f = DB.firms.find(x => String(x.id) === String(id));
  if (!f) return;
  if (on && DB.firms.filter(x => x.featured).length >= 6)
    return toast('Six already featured. Remove one first.');
  f.featured = on;
  f.featured_sort = on ? DB.firms.filter(x => x.featured).length : 0;
  if (!SESSION.demo && sb) {
    const { error } = await sb.from('firms')
      .update({ featured: on, featured_sort: f.featured_sort }).eq('id', id);
    if (error) return toast('Rejected by the database: ' + error.message);
  }
  notePending('Featured firms');
  go('featured'); buildNav();
  toast(on ? 'Featured' : 'Removed from the strip');
}

async function moveFeatured(id, dir) {
  const feat = DB.firms.filter(f => f.featured)
    .sort((a, b) => (a.featured_sort || 0) - (b.featured_sort || 0));
  const i = feat.findIndex(f => String(f.id) === String(id));
  const j = i + dir;
  if (i < 0 || j < 0 || j >= feat.length) return;
  [feat[i], feat[j]] = [feat[j], feat[i]];
  feat.forEach((f, k) => { f.featured_sort = k + 1; });
  if (!SESSION.demo && sb) {
    for (const f of feat)
      await sb.from('firms').update({ featured_sort: f.featured_sort }).eq('id', f.id);
  }
  notePending('Featured firm order');
  go('featured');
}
