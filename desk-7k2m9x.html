/* ═══════════════════════════════════════════════════════════════
   ANALYTICS
   Two different things, kept apart because they answer different
   questions.

   Site-wide traffic lives in Google Analytics and always will —
   there is no point rebuilding it.

   Per-listing views and contact taps live in YOUR database, in
   listing_events. That is the number the whole sales argument rests
   on, and it has to be yours: "your listing was viewed 46 times last
   month and 11 people tapped your number" is what a field agent puts
   in front of a shop owner, and you cannot print that from someone
   else's dashboard.
   ═══════════════════════════════════════════════════════════════ */
/* Interactive state: period, tier filter, search, sort, selected firm */
const AN = { days: 30, tier: '', q: '', sort: 'views', dir: -1, firm: null, events: [], loaded: 0 };

async function loadAnalytics(el) {
  /* Fetch once per period; everything else is filtering in the browser,
     so clicking around the dashboard is instant. */
  if (AN.loaded !== AN.days) {
    el.innerHTML = '<div class="loading">Reading the last ' + AN.days + ' days\u2026</div>';
    AN.events = await fetchEvents(AN.days);
    AN.loaded = AN.days;
  }
  paintAnalytics(el);
}

async function fetchEvents(days) {
  const since = new Date(Date.now() - days * 86400000);
  if (SESSION.demo || !sb) {
    /* Deterministic demo: dated events so the daily chart has shape */
    const out = [];
    DB.firms.slice(0, 24).forEach((f, i) => {
      const views = Math.round(seededN(i + 1, 6, 90) * days / 30);
      for (let k = 0; k < views; k++) {
        const d = new Date(Date.now() - seededN(i * 97 + k, 0, days - 1) * 86400000);
        out.push({ firm_id: f.id, kind: 'view', at: d.toISOString() });
        if (seededN(i * 13 + k, 0, 100) < 20) {
          /* Only the contact methods this firm's tier actually shows */
          const kinds = ['contact_phone', 'contact_email']
            .concat(capsOfTier(f.tier).whatsapp ? ['contact_whatsapp'] : []);
          out.push({ firm_id: f.id, at: d.toISOString(), kind: kinds[k % kinds.length] });
        }
      }
    });
    return out;
  }
  const { data, error } = await sb.from('listing_events')
    .select('firm_id,kind,occurred_at').gte('occurred_at', since.toISOString()).limit(100000);
  if (error) { AN.error = error.message; return []; }
  return (data || []).map(e => ({ firm_id: e.firm_id, kind: e.kind, at: e.occurred_at }));
}

function paintAnalytics(el) {
  el = el || document.querySelector('#pages .page');
  const firmById = new Map(DB.firms.map(f => [String(f.id), f]));
  const inScope = e => {
    const f = firmById.get(String(e.firm_id));
    if (AN.tier && (!f || (f.tier || 'free') !== AN.tier)) return false;
    if (AN.firm && String(e.firm_id) !== String(AN.firm)) return false;
    return true;
  };
  const ev = AN.events.filter(inScope);

  /* Totals */
  const isContact = k => String(k).startsWith('contact');
  const views = ev.filter(e => e.kind === 'view').length;
  const contacts = ev.filter(e => isContact(e.kind)).length;
  const byKind = {};
  ev.forEach(e => { byKind[e.kind] = (byKind[e.kind] || 0) + 1; });

  /* Per day, for the chart */
  const days = [];
  for (let i = AN.days - 1; i >= 0; i--) {
    const d = new Date(Date.now() - i * 86400000).toISOString().slice(0, 10);
    days.push({ d, v: 0, c: 0 });
  }
  const idx = new Map(days.map((x, i) => [x.d, i]));
  ev.forEach(e => {
    const i = idx.get(String(e.at || '').slice(0, 10));
    if (i == null) return;
    if (e.kind === 'view') days[i].v++; else if (isContact(e.kind)) days[i].c++;
  });

  /* Per firm */
  const per = {};
  AN.events.filter(e => !AN.tier || ((firmById.get(String(e.firm_id)) || {}).tier || 'free') === AN.tier)
    .forEach(e => {
      const k = String(e.firm_id);
      per[k] = per[k] || { views: 0, contacts: 0 };
      if (e.kind === 'view') per[k].views++; else if (isContact(e.kind)) per[k].contacts++;
    });
  let rows = Object.entries(per).map(([id, v]) => {
    const f = firmById.get(id) || {};
    return { id, name: f.name || id, tier: f.tier || 'free', slug: f.slug || '',
             views: v.views, contacts: v.contacts,
             rate: v.views ? Math.round(v.contacts / v.views * 100) : 0 };
  });
  if (AN.q) rows = rows.filter(r => r.name.toLowerCase().includes(AN.q.toLowerCase()));
  rows.sort((x, y) => AN.dir * ((x[AN.sort] > y[AN.sort]) - (x[AN.sort] < y[AN.sort])) ||
                              String(x.name).localeCompare(y.name));
  ANALYTICS_ROWS = rows;

  const tiers = ((DB.taxonomy || {}).tiers || []).map(t => t.slug);
  const selFirm = AN.firm ? firmById.get(String(AN.firm)) : null;
  const upsell = rows.filter(r => r.tier === 'free' && r.contacts >= 3).length;

  el.innerHTML =
    (SESSION.demo ? '<div class="note"><b>Demo figures.</b>Deterministic sample data so you can see ' +
      'the shape. Connect Supabase and these become your real listing_events.</div>' : '') +
    (AN.error ? '<div class="note red"><b>Could not read listing_events.</b>' + esc(AN.error) + '</div>' : '') +

    /* Controls */
    '<div class="toolbar an-controls">' +
      '<div class="seg">' + [7, 30, 90].map(d =>
        '<button class="' + (AN.days === d ? 'on' : '') + '" onclick="anSet(\'days\',' + d + ')">' +
        d + ' days</button>').join('') + '</div>' +
      '<select onchange="anSet(\'tier\',this.value)" aria-label="Tier">' +
        '<option value="">All tiers</option>' + tiers.map(t =>
        '<option value="' + t + '"' + (AN.tier === t ? ' selected' : '') + '>' + t + '</option>').join('') +
      '</select>' +
      (selFirm ? '<span class="pill p-new" style="padding:5px 10px">' + esc(selFirm.name) +
        ' <button class="x" onclick="anSet(\'firm\',null)" aria-label="Clear firm">\u00d7</button></span>' : '') +
      '<div class="spacer"></div>' +
      '<button class="btn" onclick="downloadAnalytics()">Download CSV</button>' +
      '<button class="btn" onclick="downloadDailyCsv()">Daily CSV</button>' +
      '<button class="btn" onclick="window.print()">Print</button>' +
    '</div>' +

    /* KPIs */
    '<dl class="kpis an-kpis">' +
      kpi('Listing views', views.toLocaleString(), 'last ' + AN.days + ' days') +
      kpi('Contact taps', contacts.toLocaleString(), 'call, WhatsApp or email') +
      kpi('Tap rate', (views ? Math.round(contacts / views * 100) : 0) + '%', 'views that made contact') +
      kpi('Free firms worth calling', upsell, '3+ contacts, still on Free') +
    '</dl>' +

    /* Chart */
    '<div class="panel"><h3>Views and contacts per day' +
      (selFirm ? ' \u00b7 ' + esc(selFirm.name) : AN.tier ? ' \u00b7 ' + esc(AN.tier) + ' tier' : '') +
      '</h3><div class="an-chart">' + dayChart(days) + '</div>' +
      '<div class="an-legend"><span class="lv"></span>Views <span class="lc"></span>Contacts ' +
      '<span class="rowsub" style="margin-left:auto">Hover a day for its figures</span></div></div>' +

    /* Breakdown */
    '<div class="panel"><h3>How people made contact</h3><div class="an-bars">' +
      (Object.keys(byKind).filter(isContact).sort((a, b) => byKind[b] - byKind[a]).map(k => {
        const pct = contacts ? Math.round(byKind[k] / contacts * 100) : 0;
        return '<div class="an-bar"><span>' + esc(k.replace('contact_', '')) + '</span>' +
          '<div><i style="width:' + pct + '%"></i></div><b>' + byKind[k] + ' \u00b7 ' + pct + '%</b></div>';
      }).join('') || '<p class="rowsub">No contact taps in this period.</p>') +
    '</div></div>' +

    /* Table */
    '<div class="panel"><h3>Per listing <span class="rowsub">\u00b7 click a firm to focus the chart on it</span></h3>' +
      '<div class="toolbar" style="padding:0 0 10px"><input type="search" placeholder="Find a firm" ' +
        'value="' + esc(AN.q) + '" oninput="anSet(\'q\',this.value)" style="max-width:260px">' +
        '<span class="rowsub">' + rows.length + ' firms with activity</span></div>' +
      '<div class="tscroll"><table><thead><tr>' +
        [['name', 'Firm'], ['tier', 'Tier'], ['views', 'Views'], ['contacts', 'Contacts'], ['rate', 'Tap rate']]
          .map(([k, l]) => '<th class="sortable" onclick="anSort(\'' + k + '\')">' + l +
            (AN.sort === k ? (AN.dir < 0 ? ' \u2193' : ' \u2191') : '') + '</th>').join('') +
        '<th></th></tr></thead><tbody>' +
      (rows.length ? rows.slice(0, 100).map(r =>
        '<tr class="' + (String(AN.firm) === r.id ? 'on' : '') + '" style="cursor:pointer" ' +
          'onclick="anSet(\'firm\',\'' + esc(r.id) + '\')">' +
        '<td><span class="nm">' + esc(r.name) + '</span></td>' +
        '<td><span class="pill ' + (r.tier === 'free' ? 'p-off' : 'p-new') + '">' + esc(r.tier) + '</span></td>' +
        '<td class="mono">' + r.views + '</td><td class="mono"><strong>' + r.contacts + '</strong></td>' +
        '<td class="mono">' + r.rate + '%</td>' +
        '<td class="act"><button class="btn" onclick="event.stopPropagation();firmReport(\'' +
          esc(r.slug) + '\')">Report</button></td></tr>').join('')
        : '<tr><td colspan="6"><div class="empty" style="border:none"><b>No activity</b>' +
          'Nothing matches this period and filter.</div></td></tr>') +
      '</tbody></table></div></div>' +

    '<div class="panel"><h3>Monthly reports owed <span class="rowsub">\u00b7 tiers that include one</span></h3>' +
      (reportsDue().length
        ? '<div class="tscroll"><table><tbody>' + reportsDue().map(f =>
            '<tr><td><span class="nm">' + esc(f.name) + '</span></td>' +
            '<td><span class="pill p-new">' + esc(f.tier) + '</span></td>' +
            '<td class="mono sub">' + esc(f.email || 'no email on file') + '</td>' +
            '<td class="act"><button class="btn" onclick="firmReport(\'' + esc(f.slug) + '\')">Open report</button></td></tr>').join('') +
          '</tbody></table></div>'
        : '<p class="rowsub">No firm on a tier that includes monthly reports yet.</p>') +
    '</div>' +
    '<div class="panel"><h3>Site-wide traffic</h3><div class="an-links">' +
      gaLink('https://analytics.google.com/', 'Google Analytics', 'Pages, sources and live visitors.') +
      gaLink('https://search.google.com/search-console', 'Search Console', 'What people typed to find you.') +
    '</div></div>';
}

/* A small hand-drawn SVG chart: no library, works offline, prints. */
function dayChart(days) {
  const W = 760, H = 180, P = 26;
  const max = Math.max(1, ...days.map(d => Math.max(d.v, d.c)));
  const bw = (W - P * 2) / days.length;
  const y = v => H - P - (v / max) * (H - P * 2);
  const bars = days.map((d, i) => {
    const x = P + i * bw;
    return '<g class="an-day"><title>' + d.d + ': ' + d.v + ' views, ' + d.c + ' contacts</title>' +
      '<rect x="' + (x + 1) + '" y="' + y(d.v) + '" width="' + Math.max(1, bw - 2) + '" height="' +
        (H - P - y(d.v)) + '" class="bv"/>' +
      '<rect x="' + (x + bw * 0.25) + '" y="' + y(d.c) + '" width="' + Math.max(1, bw * 0.5) +
        '" height="' + (H - P - y(d.c)) + '" class="bc"/>' +
      '<rect x="' + x + '" y="0" width="' + bw + '" height="' + H + '" fill="transparent"/></g>';
  }).join('');
  const ticks = [0, Math.round(max / 2), max].map(v =>
    '<text x="4" y="' + (y(v) + 4) + '" class="tk">' + v + '</text>').join('');
  const first = days[0] ? days[0].d.slice(5) : '', last = days.length ? days[days.length - 1].d.slice(5) : '';
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Daily views and contacts">' +
    ticks + bars +
    '<text x="' + P + '" y="' + (H - 6) + '" class="tk">' + first + '</text>' +
    '<text x="' + (W - P) + '" y="' + (H - 6) + '" class="tk" text-anchor="end">' + last + '</text></svg>';
}

function anSet(k, v) {
  AN[k] = v;
  const el = document.querySelector('#pages .page');
  if (k === 'days') loadAnalytics(el); else paintAnalytics(el);
  if (k === 'q') {             /* keep typing without losing the caret */
    const i = document.querySelector('#pages input[type=search]');
    if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); }
  }
}
function anSort(k) {
  if (AN.sort === k) AN.dir = -AN.dir; else { AN.sort = k; AN.dir = k === 'name' || k === 'tier' ? 1 : -1; }
  paintAnalytics();
}

function downloadDailyCsv() {
  const rows = [['date', 'views', 'contacts']];
  const m = {};
  AN.events.forEach(e => {
    const d = String(e.at || '').slice(0, 10); if (!d) return;
    m[d] = m[d] || [0, 0];
    if (e.kind === 'view') m[d][0]++; else if (String(e.kind).startsWith('contact')) m[d][1]++;
  });
  Object.keys(m).sort().forEach(d => rows.push([d, m[d][0], m[d][1]]));
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([rows.map(r => r.join(',')).join('\n')], { type: 'text/csv' }));
  a.download = 'buildlist-daily-' + AN.days + 'd-' + new Date().toISOString().slice(0, 10) + '.csv';
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast('Downloaded ' + (rows.length - 1) + ' days');
}

/* The table as a file. A field agent going out for the day wants it on
   a phone or printed, not behind a login on a laptop back at the office. */
let ANALYTICS_ROWS = [];
function downloadAnalytics() {
  if (!ANALYTICS_ROWS.length) { toast('Nothing to export yet'); return; }
  const head = ['Firm', 'Tier', 'Views', 'Contacts', 'Tap rate %', 'Listing'];
  const csv = [head.join(',')].concat(ANALYTICS_ROWS.map(r =>
    [r.name, r.tier, r.views, r.contacts, r.rate, 'https://buildlist.com/firms/' + r.slug]
      .map(v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"').join(',')
  )).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = 'buildlist-listing-activity-' + new Date().toISOString().slice(0, 10) + '.csv';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast('Downloaded ' + ANALYTICS_ROWS.length + ' rows');
}

function kpi(label, value, sub) {
  return '<div style="background:var(--surface);padding:16px 18px">' +
    '<dt style="font-size:12px;color:var(--text-3);margin-bottom:4px">' + label + '</dt>' +
    '<dd style="font-size:25px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums">' + value + '</dd>' +
    '<div style="font-size:12px;color:var(--text-3);margin-top:3px">' + sub + '</div></div>';
}
function gaLink(href, title, body) {
  return '<a href="' + href + '" target="_blank" rel="noopener" style="display:block;background:var(--surface);' +
    'border:1px solid var(--line);border-radius:6px;padding:14px 16px;text-decoration:none;color:inherit">' +
    '<b style="display:block;font-size:13.5px;margin-bottom:3px">' + title + '</b>' +
    '<span style="color:var(--text-2);font-size:12px;line-height:1.45">' + body + '</span></a>';
}
function seededN(n, lo, hi) {
  const x = Math.sin(n * 12.9898) * 43758.5453;
  return Math.floor(lo + (x - Math.floor(x)) * (hi - lo + 1));
}

/* ═══════════════════════════════════════════════════════════════
   MONTHLY PERFORMANCE REPORT
   The report a Premium or Platinum firm is promised, and the one-page
   argument a field agent puts in front of a Free firm. It reports what
   happened and never predicts what will — that is why people believe it.
   ═══════════════════════════════════════════════════════════════ */
function firmReport(slug) {
  const f = DB.firms.find(x => x.slug === slug);
  if (!f) return;
  const since = Date.now() - AN.days * 86400000;
  const ev = (AN.events || []).filter(e => String(e.firm_id) === String(f.id) &&
                                           (!e.at || new Date(e.at).getTime() >= since));
  const views = ev.filter(e => e.kind === 'view').length;
  const by = k => ev.filter(e => e.kind === k).length;
  const wa = by('contact_whatsapp'), ph = by('contact_phone'), em = by('contact_email');
  const contacts = wa + ph + em;
  const days = [];
  for (let i = AN.days - 1; i >= 0; i--) days.push({ d: new Date(Date.now() - i * 86400000).toISOString().slice(0, 10), v: 0, c: 0 });
  const ix = new Map(days.map((x, i) => [x.d, i]));
  ev.forEach(e => { const i = ix.get(String(e.at || '').slice(0, 10)); if (i == null) return;
    if (e.kind === 'view') days[i].v++; else if (String(e.kind).startsWith('contact')) days[i].c++; });
  const best = days.slice().sort((a, b) => b.v - a.v)[0];
  const caps = capsOfTier(f.tier);
  const period = new Date(since).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }) + ' \u2013 ' +
                 new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });

  const html = `<!doctype html><html><head><meta charset="utf-8"><title>${esc(f.name)} \u2014 performance report</title>
  <style>
    body{font:14px/1.55 system-ui,Segoe UI,sans-serif;color:#1d2521;max-width:760px;margin:30px auto;padding:0 24px}
    h1{font-size:22px;margin:0 0 2px}.sub{color:#6b776f;margin:0 0 22px}
    .brand{font-weight:800;color:#1A3C2A;font-size:15px}.brand span{color:#9A7A0F}
    .k{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:#dde3de;border:1px solid #dde3de;border-radius:8px;overflow:hidden;margin:18px 0}
    .k div{background:#fff;padding:14px}.k b{display:block;font-size:24px}.k small{color:#6b776f}
    svg{width:100%;height:auto}.bv{fill:#9DB9AC}.bc{fill:#C49A16}.tk{font-size:10px;fill:#7A857D}
    table{width:100%;border-collapse:collapse;margin-top:8px}td{padding:7px 4px;border-bottom:1px solid #eef1ee}
    .note{background:#F7F5EE;border-left:3px solid #9A7A0F;padding:10px 14px;margin-top:20px;font-size:13px}
    @media print{.noprint{display:none}body{margin:0 auto}}
  </style></head><body>
  <div class="brand">BuildList<span>.com</span></div>
  <h1>${esc(f.name)}</h1>
  <p class="sub">Listing performance \u00b7 ${period} \u00b7 ${esc((f.tier || 'free').replace(/^./, c => c.toUpperCase()))} tier</p>
  <div class="k">
    <div><small>Profile views</small><b>${views}</b></div>
    <div><small>Contact taps</small><b>${contacts}</b></div>
    <div><small>Tap rate</small><b>${views ? Math.round(contacts / views * 100) : 0}%</b></div>
    <div><small>Busiest day</small><b style="font-size:16px">${best && best.v ? new Date(best.d).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }) : '\u2014'}</b></div>
  </div>
  ${dayChart(days)}
  <table>
    <tr><td>WhatsApp taps</td><td style="text-align:right"><b>${wa}</b></td></tr>
    <tr><td>Phone taps</td><td style="text-align:right"><b>${ph}</b></td></tr>
    <tr><td>Email taps</td><td style="text-align:right"><b>${em}</b></td></tr>
  </table>
  ${(f.tier || 'free') === 'free' && contacts
    ? `<div class="note"><b>${contacts} ${contacts === 1 ? 'person' : 'people'} tried to contact you this period.</b>
       On the Free tier your listing shows a phone number only. A WhatsApp button, photographs and a
       higher place in search are included from Verified upwards.</div>`
    : `<div class="note">Figures are counted by BuildList.com from visits to your listing. They report what
       happened and are not a forecast.</div>`}
  <p class="noprint" style="margin-top:22px"><button onclick="print()">Print or save as PDF</button></p>
  </body></html>`;

  const w = window.open('', '_blank');
  if (!w) { toast('Allow pop-ups for the portal to open the report'); return; }
  w.document.write(html); w.document.close();
}
